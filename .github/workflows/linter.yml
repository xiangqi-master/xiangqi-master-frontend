name: linter

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: "18"
      - name: npm install
        run: npm install -D
      - name: run ESLint
        run: |
          npx eslint --ext .js,.jsx,.ts,.tsx . --rule 'prettier/prettier: [error]'
      - name: run test cases
        run: npm run test
