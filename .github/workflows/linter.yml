name: linter

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: '18.20.5'
      - name: install dependencies
        run: npm ci
      - name: run ESLint
        run: npx eslint --fix --ext .js,.jsx,.ts,.tsx ./src/
      - name: run test cases
        run: npm run test
